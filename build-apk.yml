name: Construire l'APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparer l'application
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp config.js www/config.js
          if [ -n "$SB_URL" ]; then echo "window.SB={url:\"$SB_URL\",key:\"$SB_KEY\"};" > www/config.js; fi
      - name: Installer les dependances
        run: npm install
      - name: Creer le projet Android
        run: npx cap add android
      - name: Autoriser la camera
        run: sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - name: Copier l'application
        run: npx cap sync android
      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: gestion-commerce-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
